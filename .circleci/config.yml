version: 2

jobs:
  build:
    working_directory: ~/flask-arrested
    docker:
      - image: python:3
    branches:
      - wip/version-0.1.0
      - feature/cirlcie-ci
    steps:
      - checkout
      - restore_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
      - run:
          name: Install Python deps in a venv
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - "venv"
      - run:
          command: |
            . venv/bin/activate
            py.test -s --cov=arrested --cov-report=term-missing --tb=short tests/
      - deploy:
          command: |
            sudo chown -R ubuntu:ubuntu py_kim.egg-info
            sed "s/PYPI_USERNAME/$PYPI_USERNAME/;s/PYPI_PASSWORD/$PYPI_PASSWORD/" < pypirc.template > ~/.pypirc
            python setup.py register -r pypitest
            python setup.py sdist bdist_wheel upload -r pypitest
            python setup.py register -r pypi
            python setup.py sdist bdist_wheel upload -r pypi
            curl -X POST http://readthedocs.org/build/kim
