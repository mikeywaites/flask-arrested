version: 2

jobs:
  build:
    working_directory: ~/flask-arrested
    docker:
      - image: python:3
    steps:
      - checkout
      - restore_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
      - run:
          name: Install Python deps in a venv
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - "venv"
	  - run:
          command: |
            . venv/bin/activate
			py.test -s --cov=arrested --cov-report=term-missing --tb=short tests/
